<style>
/* Layout: assistent en dos passos (grup → aula) i, després, plànol de l'aula a l'esquerra amb revisió i eines al costat. */
.dist{
  --bg:#F8F7F4; --surface:#FFFFFF; --fg:#2B2B2B; --muted:#6B6B6B; --line:#E4DFD7; --grid:#ECE9E2;
  --accent:#39698C; --accent-ink:#FFFFFF; --accent-soft:#EAF1F6;

  --bad:#C0392B; --bad-soft:#FBE1DD; --warn:#A86A00; --warn-soft:#FFF0CC; --ok:#3A7A55; --sel:#B5561D;
  --font:'Work Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
}
.dist{flex:1;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4;padding:28px max(24px,env(safe-area-inset-right,0px)) 48px max(24px,env(safe-area-inset-left,0px))}
.wrap{max-width:1232px;margin:0 auto;display:grid;gap:14px}
.dist h1{font-family:'Poppins',sans-serif;color:var(--accent);font-size:1.7rem;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.dist h1 .tag{background:var(--accent);color:var(--accent-ink);padding:0 .35em;border-radius:6px}
.dist h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:700}
.dist h3{font-family:'Poppins',sans-serif;font-weight:600!important;font-size:1.15rem;margin:0 0 4px;font-weight:700}
.dist .dist-cap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;justify-content:space-between}
.dist .dist-cap .meta{margin:0;color:var(--muted);font-size:.85rem}
.dist button,.dist select,.dist input,.dist textarea{font:inherit;color:inherit}
.dist button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-weight:700;font-size:.88rem}
.dist button:hover{border-color:var(--muted)}
.dist button:disabled{opacity:.45;cursor:default}
.dist button:focus-visible,.dist input:focus-visible,.dist select:focus-visible,.dist textarea:focus-visible,.dist [tabindex]:focus-visible{outline:3px solid var(--sel);outline-offset:1px}
.dist button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dist button.primary:hover{background:#2A5070;border-color:#2A5070}
.dist button.danger{color:var(--bad)}
.dist button.small{padding:3px 8px;font-size:.8rem}
.dist input[type=text],.dist input[type=number],.dist select,.dist textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:0}
.dist textarea{width:100%;min-height:180px;resize:vertical;line-height:1.5}
.dist label.f{display:grid;gap:3px;font-size:.8rem;color:var(--muted);font-weight:700}
.dist label.f input,.dist label.f select,.dist label.f textarea{font-weight:400;color:var(--fg)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tab{border-radius:999px;padding:6px 14px;background:var(--surface)}
.tab[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:middle}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.bar .grow{flex:1 1 170px;min-width:0}
.sep{width:1px;align-self:stretch;background:var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0}

.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.planscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.plan{position:relative;width:100%;container-type:inline-size;touch-action:manipulation}
.plan.edit{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);border:1px solid var(--line);border-radius:6px;touch-action:none}
.tbl{position:absolute;border:1.5px solid var(--fg);border-radius:4px;pointer-events:none}
.tbl.bad{box-shadow:0 0 0 3px var(--bad)} .tbl.warn{box-shadow:0 0 0 3px var(--warn)}
.seat{position:absolute;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(var(--u)*.37);
  cursor:pointer;user-select:none;-webkit-user-select:none;outline-offset:-2px;box-shadow:inset 0 0 0 .5px color-mix(in srgb,var(--fg) 45%,transparent);padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.furn{position:absolute;border:1.5px solid var(--fg);background:var(--furn);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*.34);border-radius:4px;white-space:nowrap;overflow:hidden}
.ed-item{position:absolute;border:1.5px solid var(--fg);border-radius:4px;cursor:grab;display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*.34);font-weight:700;color:var(--muted);user-select:none}
.ed-item.sel{box-shadow:0 0 0 3px var(--sel)}
.ed-item.dragging{opacity:.75;cursor:grabbing}
.ed-item .cells{position:absolute;inset:0;display:grid;pointer-events:none}
.ed-item .cells i{border-right:1px dashed color-mix(in srgb,var(--fg) 35%,transparent);border-bottom:1px dashed color-mix(in srgb,var(--fg) 35%,transparent)}
.ttag{position:absolute;font-size:calc(var(--u)*.26);color:var(--muted);font-weight:700;text-align:right}
.selbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;min-height:36px;margin-bottom:8px;font-size:.9rem;color:var(--muted)}
.selbar b{color:var(--fg)}
.side{display:grid;gap:14px}
.issues{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.88rem}
.issues li{padding:6px 9px;border-radius:8px;display:flex;gap:8px;align-items:flex-start}
.issues li.bad{background:var(--bad-soft)} .issues li.warn{background:var(--warn-soft)} .issues li.ok{color:var(--ok);font-weight:700}

.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;padding:6px;border:1.5px dashed var(--line);border-radius:10px}

.chip.sel{background:var(--sel);color:#fff;border-color:var(--sel)}

.dist details{border-top:1px solid var(--line);padding-top:10px}
.dist details:first-of-type{border-top:0;padding-top:0}
.dist summary{cursor:pointer;font-weight:700;font-size:.95rem}
.rows{display:grid;gap:6px;margin-top:8px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.row select,.row input{flex:1 1 90px}
.rlist{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px;font-size:.88rem}
.rlist li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:4px 8px;background:var(--bg);border-radius:8px}
.pill{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:1px 7px;border-radius:999px;background:var(--accent-soft)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.note{font-size:.84rem;color:var(--muted);margin:6px 0 0;max-width:70ch}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:700;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:.85rem;font-weight:700;color:var(--bad)}
.hist{font-size:.85rem;width:100%;border-collapse:collapse}
.hist td{padding:3px 4px;border-bottom:1px solid var(--line)}
.hist td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
/* Assistent */
.steps{display:flex;gap:8px;flex-wrap:wrap;font-size:.85rem;font-weight:700;color:var(--muted)}
.steps span{padding:4px 12px;border-radius:999px;border:1px solid var(--line)}
.steps span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wz{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
@media (max-width:760px){.wz{grid-template-columns:minmax(0,1fr)}}
.wz-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.palette{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.palette button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.count{font-weight:700;font-variant-numeric:tabular-nums}
.count.ok{color:var(--ok)} .count.bad{color:var(--bad)}
.edgrid{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;align-items:start}
@media (max-width:900px){.edgrid{grid-template-columns:minmax(0,1fr)}}
.preview-names{font-size:.85rem;color:var(--muted)}

@media (max-width:620px){.dist{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

<script>
(() => {
"use strict";
// Unitats: un lloc fa 2 × 1 unitats de la quadrícula.
const SW = 2, SH = 1;
const $ = id => document.getElementById(id);
const coll = new Intl.Collator("ca");
const clone = o => JSON.parse(JSON.stringify(o));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
function el(tag, attrs={}, ...kids){ const e=document.createElement(tag); for(const[k,v] of Object.entries(attrs)){ if(v==null||v===false) continue; if(k==="class") e.className=v; else if(k==="text") e.textContent=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v===true?"":v);} kids.flat().forEach(c=>c!=null&&e.append(c)); return e; }
function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>t.hidden=true,2800); }

// ---------- Models d'aula ----------
function grid(n, perTable, w, h, cols, gapX, stepY){
  const tables=Math.ceil(n/perTable), rows=Math.ceil(tables/cols), tw=w*SW;
  const taules=[]; let k=0;
  for(let r=0;r<rows;r++) for(let c=0;c<cols&&k<tables;c++,k++) taules.push({id:"t"+(k+1),x:1+c*(tw+gapX),y:1+r*stepY,w,h});
  const width=cols*tw+(cols-1)*gapX, yEnd=1+(rows-1)*stepY+h;
  const pw=Math.min(width,Math.max(8,Math.round(width*0.6)));
  const prof={x:1+width-4,y:yEnd+1,w:4};
  const pissarra={x:1+Math.round((width-pw)/2),y:yEnd+3,w:pw};
  return {cols:width+2,rows:pissarra.y+2,taules,pissarra,prof};
}
const PRESETS = {
  parelles:{nom:"Files de parelles", make:n=>grid(n,2,2,1,n/2>8?3:2,2,2)},
  individuals:{nom:"Taules individuals", make:n=>grid(n,1,1,1,n>24?6:5,1,2)},
  trios:{nom:"Files de tres", make:n=>grid(n,3,3,1,n/3>8?3:2,2,2)},
  grups4:{nom:"Grups de 4", make:n=>grid(n,4,2,2,Math.ceil(n/4)>6?4:3,2,3)},
  grups6:{nom:"Grups de 6", make:n=>grid(n,6,3,2,Math.ceil(n/6)>4?3:2,2,3)},
  mixt:{nom:"Exemple: 3 columnes amb trios", make:()=>({cols:18,rows:13,
    taules:[[0,1,2],[0,3,2],[0,5,2],[0,7,2],[6,0,2],[6,2,2],[6,4,2],[6,6,2],[6,8,2],[14,0,2],[14,2,2],[14,4,2],[12,6,3],[12,8,3]].map(([x,y,w],i)=>({id:"t"+(i+1),x,y,w,h:1})),
    prof:{x:14,y:10,w:4},pissarra:{x:4,y:12,w:10}})},
};
function seatsOf(aula){ const out=[]; for(const t of aula.taules) for(let j=0;j<t.h;j++) for(let i=0;i<t.w;i++) out.push({id:t.id+"-"+(j*t.w+i+1),t,x:t.x+i*SW,y:t.y+j*SH}); return out; }
function frontSet(aula, seats){
  const p=aula.pissarra; if(!p) return new Set();
  const cx=p.x+p.w/2, cy=p.y+.5;
  const d=t=>Math.hypot(t.x+t.w*SW/2-cx, (t.y+t.h/2-cy)*1.6);
  const ts=aula.taules.slice().sort((a,b)=>d(a)-d(b));
  const limit=Math.max(4,Math.round(seats.length/3)); const set=new Set(); let n=0;
  for(const t of ts){ if(n>=limit) break; n+=t.w*t.h; set.add(t.id); }
  return new Set(seats.filter(s=>set.has(s.t.id)).map(s=>s.id));
}
function itemsOverlap(a,b){ return a.x < b.x+b.W && b.x < a.x+a.W && a.y < b.y+b.H && b.y < a.y+a.H; }
const boxT = t=>({x:t.x,y:t.y,W:t.w*SW,H:t.h*SH});
const boxF = f=>({x:f.x,y:f.y,W:f.w,H:1});

// ---------- Estat ----------
let db=null, downloads=null, userId=null, dbOk=false;
let groups={}, gid=null;
let drafts={}, currentId=null, view="fons", selected=null, delConfirm=false, gDelConfirm=false;
let mode="main"; // main | wizard | start
const MODE="web";   // app (Claude) · local (fitxer amb memòria al navegador) · web (no desa res)
let unsaved=false;
let wz=null;      // {step, nom, n, noms, aula, editingGid}
const G = () => groups[gid] || null;

// ---------- Persistència ----------
const LS="distribucions-aula-v1";
function lsAll(){ if(MODE==="web") return {}; try{ return JSON.parse(localStorage.getItem(LS)||"{}")||{}; }catch(e){ return {}; } }
function lsPut(){ if(MODE==="web") return; try{ localStorage.setItem(LS, JSON.stringify(groups)); }catch(e){} }
const chains={};
function persist(g){
  unsaved=true; g.actualitzat=Date.now(); groups[g.id]=g; lsPut();
  if(db && userId && dbOk){
    const ref=db.collection("data/users/"+userId).doc(g.id);
    chains[g.id]=(chains[g.id]||Promise.resolve()).then(()=>ref.set(clone(g))).catch(e=>{ dbOk=false; setStatus(); });
  }
}
function removeGroup(id){
  delete groups[id]; lsPut();
  if(db && userId && dbOk) db.collection("data/users/"+userId).doc(id).delete().catch(()=>{});
}
function setStatus(){ $("status").textContent = MODE==="web" ? "No es desa res: descarrega el CSV abans de tancar" : dbOk ? "Desat al teu compte" : "Desat en aquest navegador"; }

// ---------- Distribucions del grup actual ----------
const sortedDists = () => { const g=G(); return g?Object.entries(g.dists||{}).sort((a,b)=>(a[1].ordre||0)-(b[1].ordre||0)):[]; };
function cur(){ const g=G(); if(!g||!currentId) return null; return drafts[currentId] || g.dists[currentId] || null; }
function ensureDraft(){ const g=G(); if(!g||!currentId) return null; unsaved=true; if(!drafts[currentId]) drafts[currentId]=clone(g.dists[currentId]||{nom:"Nova distribució",etiqueta:"",ordre:Date.now(),seients:{},fixats:[]}); return drafts[currentId]; }
function isDirty(id){ const g=G(); return !!drafts[id] && JSON.stringify(drafts[id]) !== JSON.stringify(g?.dists[id]||null); }

// ---------- Anàlisi ----------
let SEATS=[], SEAT={}, FRONT=new Set();
function computeSeats(){ const g=G(); SEATS=g?seatsOf(g.aula):[]; SEAT={}; SEATS.forEach(s=>SEAT[s.id]=s); FRONT=g?frontSet(g.aula,SEATS):new Set(); }
function tableGroups(seients){ const g={}; for(const s of SEATS){ const n=seients[s.id]; if(!n) continue; (g[s.t.id]=g[s.t.id]||[]).push(n); } return g; }
const pk = (a,b) => coll.compare(a,b)<0 ? a+"|"+b : b+"|"+a;
function pairsOf(seients){ const out=[]; for(const names of Object.values(tableGroups(seients))) for(let i=0;i<names.length;i++) for(let j=i+1;j<names.length;j++) out.push(pk(names[i],names[j])); return out; }
function history(beforeOrdre){
  const h={}; for(const [id,d] of sortedDists()){ if(beforeOrdre!=null && (id===currentId || (d.ordre||0)>=beforeOrdre)) continue; for(const p of pairsOf(d.seients||{})) (h[p]=h[p]||[]).push(d.nom||"(sense nom)"); } return h;
}
function unassigned(d){ const g=G(); const seated=new Set(Object.values(d.seients).filter(Boolean)); return g.alumnes.filter(n=>!seated.has(n)).sort(coll.compare); }
function analyse(d){
  const g=G(), issues=[], badTables=new Set(), warnTables=new Set(), seatOf={};
  for(const s of SEATS){ const n=d.seients[s.id]; if(n) seatOf[n]=s; }
  for(const r of g.restriccions){
    const sa=seatOf[r.a], sb=seatOf[r.b]; if(!sa||!sb) continue;
    const same=sa.t.id===sb.t.id;
    if(r.tipus==="separar"&&same){ issues.push({k:"bad",t:`${r.a} i ${r.b} són a la mateixa taula (marcat: no junts).`}); badTables.add(sa.t.id); }
    if(r.tipus==="junts"&&!same){ issues.push({k:"bad",t:`${r.a} i ${r.b} no són a la mateixa taula (marcat: millor junts).`}); badTables.add(sa.t.id); badTables.add(sb.t.id); }
  }
  for(const n of g.davant){ const s=seatOf[n]; if(s&&!FRONT.has(s.id)){ issues.push({k:"bad",t:`${n} no és a les primeres files.`}); badTables.add(s.t.id); } }
  const h=history(d.ordre||Date.now());
  for(const [t,names] of Object.entries(tableGroups(d.seients))) for(let i=0;i<names.length;i++) for(let j=i+1;j<names.length;j++){ const p=pk(names[i],names[j]); if(h[p]){ issues.push({k:"warn",t:`${names[i]} i ${names[j]} ja van seure junts a: ${h[p].join(", ")}.`}); warnTables.add(t);} }
  const un=unassigned(d); if(un.length) issues.push({k:"warn",t:`${un.length} alumne${un.length>1?"s":""} sense lloc.`});
  if(g.alumnes.length>SEATS.length) issues.push({k:"bad",t:`Hi ha ${g.alumnes.length} alumnes i només ${SEATS.length} llocs. Afegeix taules a «Edita l'aula».`});

// ---------- Proposta automàtica ----------
function propose(){
  const g=G(), d=ensureDraft(); if(!d) return;
  const fix=new Set(d.fixats||[]);
  const free=SEATS.map(s=>s.id).filter(s=>!fix.has(s));
  const fixedNames=new Set([...fix].map(s=>d.seients[s]).filter(Boolean));
  const pool=g.alumnes.filter(n=>!fixedNames.has(n));
  if(pool.length>free.length) toast("Hi ha més alumnes que llocs lliures.");
  const h=history(d.ordre||Date.now());
  const sep=g.restriccions.filter(r=>r.tipus==="separar"), jun=g.restriccions.filter(r=>r.tipus==="junts"), front=new Set(g.davant);
  const assign={}; for(const s of fix) if(d.seients[s]) assign[s]=d.seients[s];
  const sh=pool.slice().sort(()=>Math.random()-.5); free.forEach((s,i)=>{ assign[s]=sh[i]||""; });
  const cost=a=>{
    let c=0; const seatOf={}; for(const s of SEATS) if(a[s.id]) seatOf[a[s.id]]=s;
    const tb=n=>seatOf[n]?seatOf[n].t.id:null;
    for(const r of sep) if(tb(r.a)&&tb(r.a)===tb(r.b)) c+=100;
    for(const r of jun) if(tb(r.a)&&tb(r.b)&&tb(r.a)!==tb(r.b)) c+=50;
    for(const n of front) if(seatOf[n]&&!FRONT.has(seatOf[n].id)) c+=40;
    for(const p of pairsOf(a)) if(h[p]) c+=4*h[p].length;
    for(const names of Object.values(tableGroups(a))) if(names.length===1) c+=2;
    return c;
  };
  let curA=Object.assign({},assign), curC=cost(curA), best=Object.assign({},curA), bestC=curC; const N=6000;
  for(let it=0; it<N && bestC>0 && free.length>1; it++){
    const s1=free[Math.random()*free.length|0], s2=free[Math.random()*free.length|0]; if(s1===s2) continue;
    const t=curA[s1]; curA[s1]=curA[s2]; curA[s2]=t;
    const c=cost(curA), temp=Math.max(.01,3*(1-it/N));
    if(c<=curC||Math.random()<Math.exp((curC-c)/temp)){ curC=c; if(c<bestC){ bestC=c; best=Object.assign({},curA);} }
    else { curA[s2]=curA[s1]; curA[s1]=t; }
  }
  for(const k of Object.keys(best)) if(!best[k]) delete best[k];
  d.seients=best; selected=null; render();
  toast(bestC===0?"Proposta feta sense conflictes ni parelles repetides.":"Proposta feta. Revisa els avisos.");
}

  if(g.alumnes.includes(newN)){ toast("Ja hi ha algú amb aquest nom"); render(); return; }
  g.alumnes=g.alumnes.map(n=>n===oldN?newN:n);
  g.restriccions=g.restriccions.map(r=>({...r,a:r.a===oldN?newN:r.a,b:r.b===oldN?newN:r.b})); g.davant=g.davant.map(n=>n===oldN?newN:n);
  const fx=s=>{ for(const k of Object.keys(s)) if(s[k]===oldN) s[k]=newN; };
  Object.values(g.dists).forEach(d=>fx(d.seients)); Object.values(drafts).forEach(d=>fx(d.seients));
  persist(g); toast(`${oldN} → ${newN}`); render();
}
function removeStudent(n){ const g=G(); g.alumnes=g.alumnes.filter(x=>x!==n); g.restriccions=g.restriccions.filter(r=>r.a!==n&&r.b!==n); g.davant=g.davant.filter(x=>x!==n); persist(g); render(); }

// ---------- CSV ----------
// Format: una fila per alumne i una columna per distribució (llocs com T3-2 = taula 3, lloc 2).
// Al final, files que comencen per # guarden l'etiqueta de cada distribució, el grup, l'aula i les restriccions.
const SEP=";";
const csvCell=v=>{ v=String(v??""); return /[";\n\r,]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; };
const seatLabel=id=>id.replace(/^t/i,"T");
function saveCurrentDraft(){ const g=G(); if(g&&currentId&&isDirty(currentId)&&drafts[currentId]){ g.dists[currentId]=cleanDist(drafts[currentId]); delete drafts[currentId]; persist(g); return true; } return false; }
function exportCSV(){
  const g=G(); if(!g) return;
  const saved=saveCurrentDraft();
  const ds=Object.values(g.dists).sort((a,b)=>(a.ordre||0)-(b.ordre||0));
  const seen={}; const heads=ds.map(d=>{ let h=d.nom||"Distribució"; let i=2; while(seen[h]) h=(d.nom||"Distribució")+" ("+(i++)+")"; seen[h]=1; return h; });
  const rows=[["Alumne",...heads,"Primeres files"]];
  const where=ds.map(d=>{ const m={}; for(const [k,v] of Object.entries(d.seients||{})) m[v]=seatLabel(k); return m; });
  g.alumnes.slice().sort(coll.compare).forEach(n=>rows.push([n,...where.map(m=>m[n]||""),g.davant.includes(n)?"sí":""]));
  rows.push(["#etiqueta",...ds.map(d=>d.etiqueta||""),""]);
  rows.push(["#grup",g.nom]);
  const a=g.aula; rows.push(["#aula",a.cols,a.rows]);
  if(a.pissarra) rows.push(["#pissarra",a.pissarra.x,a.pissarra.y,a.pissarra.w]);
  if(a.prof) rows.push(["#prof",a.prof.x,a.prof.y,a.prof.w]);
  a.taules.forEach(t=>rows.push(["#taula",seatLabel(t.id),t.x,t.y,t.w,t.h]));
  g.restriccions.forEach(r=>rows.push(["#restriccio",r.a,r.b,r.tipus==="junts"?"junts":"no junts"]));
  const txt="﻿"+rows.map(r=>r.map(csvCell).join(SEP)).join("\r\n")+"\r\n";
  saveFile(`Distribucions_${slug(g.nom)}.csv`, new Blob([txt],{type:"text/csv;charset=utf-8"}));
  unsaved=false;
  if(saved){ toast("S'ha desat la distribució actual i s'ha descarregat el CSV"); render(); }
}
function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const first=text.split(/\r?\n/)[0]||""; const cnt=c=>first.split(c).length;
  const sep=[";","\t",","].sort((a,b)=>cnt(b)-cnt(a))[0];
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true; else if(ch===sep){ row.push(cell); cell=""; }
    else if(ch==="\n"||ch==="\r"){ if(ch==="\r"&&text[i+1]==="\n") i++; row.push(cell); rows.push(row); row=[]; cell=""; }
    else cell+=ch; }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  return rows.map(r=>r.map(c=>c.trim())).filter(r=>r.some(Boolean));
}
function readCsv(text){
  const all=parseCSV(text); if(!all.length) throw 0;
  const meta=all.filter(r=>r[0].startsWith("#")||/^etiqueta$/i.test(r[0]));
  const rows=all.filter(r=>!meta.includes(r)); if(!rows.length) throw 0;
  const hasHead=/^(alumne|alumna|alumnes|nom|noms|name)$/i.test(rows[0][0]) || rows[0].slice(1).some(c=>c&&!/^T\d+-\d+$/i.test(c)&&!/^s[ií]$/i.test(c));
  const head=hasHead?rows[0]:rows[0].map((_,i)=>i?"Distribució "+i:"Alumne");
  const body=hasHead?rows.slice(1):rows;
  const etq=meta.find(r=>/^#?etiqueta$/i.test(r[0]));
  const names=[], seen={}; body.forEach(r=>{ const n=r[0]; if(n&&!seen[n]){ seen[n]=1; names.push(n); } });
  const dists=[], davant=[];
  head.forEach((h,ci)=>{ if(!ci) return;
    if(/^primeres files$/i.test(h)){ body.forEach(r=>{ if(/^(s[ií]|x|1|yes)$/i.test(r[ci]||"")) davant.push(r[0]); }); return; }
    const seients={}; body.forEach(r=>{ const v=(r[ci]||"").toUpperCase(); if(/^T\d+-\d+$/.test(v)&&r[0]) seients["t"+v.slice(1)]=r[0]; });
    dists.push({nom:h,etiqueta:etq?(etq[ci]||""):"",seients});
  });
  const num=v=>{ const n=parseInt(v,10); return isNaN(n)?0:n; };
  const m=k=>meta.filter(r=>r[0].toLowerCase()===k);
  let aula=null; const au=m("#aula")[0];
  if(au){
    aula={cols:Math.max(8,num(au[1])),rows:Math.max(6,num(au[2])),taules:[],pissarra:null,prof:null};
    const p=m("#pissarra")[0]; if(p) aula.pissarra={x:num(p[1]),y:num(p[2]),w:Math.max(2,num(p[3]))};
    const pr=m("#prof")[0]; if(pr) aula.prof={x:num(pr[1]),y:num(pr[2]),w:Math.max(2,num(pr[3]))};
    m("#taula").forEach(r=>{ const id=(r[1]||"").toLowerCase(); if(/^t\d+$/.test(id)) aula.taules.push({id,x:num(r[2]),y:num(r[3]),w:Math.max(1,Math.min(4,num(r[4])||1)),h:Math.max(1,Math.min(3,num(r[5])||1))}); });
  }
  const restr=m("#restriccio").filter(r=>r[1]&&r[2]).map(r=>({a:r[1],b:r[2],tipus:/^junts$/i.test(r[3]||"")?"junts":"separar"}));
  const grup=(m("#grup")[0]||[])[1]||"";
  return {names,dists,davant,aula,restr,grup};
}
function applyCsv(g,csv){
  let added=0, nd=0, lost=0, skipped=0;
  csv.names.forEach(n=>{ if(!g.alumnes.includes(n)){ g.alumnes.push(n); added++; } });
  csv.davant.forEach(n=>{ if(!g.davant.includes(n)) g.davant.push(n); });
  (csv.restr||[]).forEach(r=>{ if(!g.restriccions.some(x=>pk(x.a,x.b)===pk(r.a,r.b))) g.restriccions.push(r); });
  const valid=new Set(seatsOf(g.aula).map(s=>s.id)); const base=Date.now();
  csv.dists.forEach((d,i)=>{
    if(Object.values(g.dists).some(x=>x.nom===d.nom&&JSON.stringify(x.seients)===JSON.stringify(d.seients))){ skipped++; return; }
    const seients={}; for(const [k,v] of Object.entries(d.seients)){ if(valid.has(k)) seients[k]=v; else lost++; }
    g.dists[uid("d")]={nom:d.nom,etiqueta:d.etiqueta,ordre:base+i,seients,fixats:[]}; nd++;
  });
  persist(g); return {added,dists:nd,lost,skipped};
}
function importFullCsv(csv, fileName){
  let nom=csv.grup||fileName.replace(/\.[^.]+$/,"").replace(/^Distribucions_/,"").replace(/_/g," ")||"Grup";
  const taken=new Set(Object.values(groups).map(g=>g.nom)); let n2=nom, i=2; while(taken.has(n2)) n2=nom+" ("+(i++)+")";
  const g={id:uid("g"),nom:n2,alumnes:[],restriccions:[],davant:[],aula:csv.aula,dists:{},actualitzat:0};
  const r=applyCsv(g,csv); gid=g.id; mode="main"; selected=null; computeSeats(); pickLatest(); unsaved=false; render();
  toast(`${g.nom}: ${g.alumnes.length} alumnes i ${r.dists} distribucions carregades`);
}

const CP1252={0x20AC:128,0x201A:130,0x0192:131,0x201E:132,0x2026:133,0x2020:134,0x2021:135,0x02C6:136,0x2030:137,0x0160:138,0x2039:139,0x0152:140,0x017D:142,0x2018:145,0x2019:146,0x201C:147,0x201D:148,0x2022:149,0x2013:150,0x2014:151,0x02DC:152,0x2122:153,0x0161:154,0x203A:155,0x0153:156,0x017E:158,0x0178:159};
function pdfStr(s){
  let out="";
  for(const ch of String(s).normalize("NFC")){
    let c=ch.codePointAt(0);
    if(c>255) c=CP1252[c] ?? (ch.normalize("NFD").charCodeAt(0)<128?ch.normalize("NFD").charCodeAt(0):63);
    if(c===40||c===41||c===92) out+="\\"+String.fromCharCode(c);
    else if(c<32||c>126) out+="\\"+c.toString(8).padStart(3,"0");
    else out+=String.fromCharCode(c);
  }
  return "("+out+")";
}
const measCtx=document.createElement("canvas").getContext("2d");
function textW(s,size,bold){ measCtx.font=`${bold?"bold ":""}${size}px Helvetica, Arial, sans-serif`; return measCtx.measureText(s).width; }
function pdfPageOps(g,d,v){
  const PW=842, PH=595, aula=g.aula, top=95, bottom=45;
  const k=Math.min((PW-80)/aula.cols,(PH-top-bottom)/aula.rows), ox=(PW-aula.cols*k)/2, oy=top;
  const ops=["0 G 0 g 1 w"];
  const txt=(s,x,yTop,size,bold,align)=>{ if(!s) return; const w=textW(s,size,bold); const xx=align==="center"?x-w/2:align==="right"?x-w:x; ops.push(`BT /${bold?"F2":"F1"} ${size.toFixed(2)} Tf ${xx.toFixed(2)} ${(PH-yTop).toFixed(2)} Td ${pdfStr(s)} Tj ET`); };
  const R=(x,y,w,h)=>{ if(v==="pissarra"){x=aula.cols-x-w;y=aula.rows-y-h;} return [ox+x*k,oy+y*k,w*k,h*k]; };
  const box=(r,s,maxSize)=>{ ops.push(`${r[0].toFixed(2)} ${(PH-r[1]-r[3]).toFixed(2)} ${r[2].toFixed(2)} ${r[3].toFixed(2)} re S`); if(s){ let size=maxSize; const w=textW(s,size); if(w>r[2]-6) size=Math.max(5,size*(r[2]-6)/w); txt(s,r[0]+r[2]/2,r[1]+r[3]/2+size*.35,size,false,"center"); } };
  const fs=Math.max(7,Math.min(13,k*.42));
  txt("Distribució alumnat "+g.nom,PW/2,58,24,true,"center");
  if(aula.pissarra) box(R(aula.pissarra.x,aula.pissarra.y,aula.pissarra.w,1),"Pissarra",fs);
  if(aula.prof) box(R(aula.prof.x,aula.prof.y,aula.prof.w,1),"Taula professor/a",fs);
  for(const s of SEATS) box(R(s.x,s.y,SW,SH),d.seients[s.id]||"",fs);
  txt(d.etiqueta||d.nom||"",ox+aula.cols*k,oy+aula.rows*k+22,9,false,"right");
  txt(v==="pissarra"?"Vista des de la pissarra":"Vista des del fons de l'aula",ox,oy+aula.rows*k+22,9,false,"left");
  return ops.join("\n");
}
function buildPdf(pages){
  const objs=[]; const add=s=>{ objs.push(s); return objs.length; };
  const cat=add(null), pagesId=add(null);
  const f1=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  const f2=add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  const kids=[];
  for(const content of pages){
    const c=add(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 842 595] /Resources << /Font << /F1 ${f1} 0 R /F2 ${f2} 0 R >> >> /Contents ${c} 0 R >>`));
  }
  objs[cat-1]=`<< /Type /Catalog /Pages ${pagesId} 0 R >>`;
  objs[pagesId-1]=`<< /Type /Pages /Kids [${kids.map(k=>k+" 0 R").join(" ")}] /Count ${kids.length} >>`;
  let out="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n"; const offs=[];
  objs.forEach((o,i)=>{ offs.push(out.length); out+=`${i+1} 0 obj\n${o}\nendobj\n`; });
  const xref=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("");
  out+=`trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  const bytes=new Uint8Array(out.length); for(let i=0;i<out.length;i++) bytes[i]=out.charCodeAt(i)&255;
  return new Blob([bytes],{type:"application/pdf"});
}
function exportPDF(which){
  const g=G(), d=cur(); if(!d) return;
  const views=which==="dues"?["fons","pissarra"]:[which];
  const blob=buildPdf(views.map(v=>pdfPageOps(g,d,v)));
  const suf=which==="dues"?"dues_vistes":which==="fons"?"des_del_fons":"des_de_la_pissarra";
  saveFile(`Distribucio_${slug(g.nom)}_${slug(d.nom)}_${suf}.pdf`, blob);
}

  const tools=[["mou","✋ Mou / selecciona"],["t1","+ Taula d'1"],["t2","+ Taula de 2"],["t3","+ Taula de 3"],["g4","+ Grup de 4"],["g6","+ Grup de 6"],["esborra","🗑 Esborra"]];

function getItem(key){ const a=wz.aula; if(key==="pissarra") return a.pissarra; if(key==="prof") return a.prof; return a.taules.find(t=>t.id===key); }
function itemBox(key,it){ return (key==="pissarra"||key==="prof")?boxF(it):boxT(it); }
function overlapsAny(aula,skipKey,box){
  for(const t of aula.taules) if(t.id!==skipKey && itemsOverlap(box,boxT(t))) return true;
  if(aula.pissarra&&skipKey!=="pissarra"&&itemsOverlap(box,boxF(aula.pissarra))) return true;
  if(aula.prof&&skipKey!=="prof"&&itemsOverlap(box,boxF(aula.prof))) return true;
  return false;
}
function clampAll(aula){
  const fit=(it,W,H)=>{ it.x=Math.max(0,Math.min(aula.cols-W,it.x)); it.y=Math.max(0,Math.min(aula.rows-H,it.y)); };
  aula.taules.forEach(t=>fit(t,t.w*SW,t.h)); if(aula.pissarra){ aula.pissarra.w=Math.min(aula.pissarra.w,aula.cols); fit(aula.pissarra,aula.pissarra.w,1);} if(aula.prof){ aula.prof.w=Math.min(aula.prof.w,aula.cols); fit(aula.prof,aula.prof.w,1); }
}
function renderEditor(plan){
  const aula=wz.aula; sizePlan(plan,aula); plan.textContent="";
  const rect=makeRect(aula,false);
  const items=[["pissarra",aula.pissarra,"Pissarra"],["prof",aula.prof,"Taula professor/a"]].filter(x=>x[1]).map(([k,it,l])=>({k,it,label:l,W:it.w,H:1,furn:true}))
    .concat(aula.taules.map(t=>({k:t.id,it:t,label:"",W:t.w*SW,H:t.h,t})));
  for(const o of items){
    const e=el("div",{class:"ed-item"+(wz.sel===o.k?" sel":""),tabindex:"0",role:"button","aria-label":o.furn?o.label:`Taula de ${o.t.w*o.t.h}`});
    Object.assign(e.style,rect(o.it.x,o.it.y,o.W,o.H));
    e.style.background=o.furn?"var(--furn)":tableColor(aula,o.t);
    if(o.furn) e.append(o.label); else { e.append(o.k.toUpperCase()); const c=el("div",{class:"cells"}); c.style.gridTemplateColumns=`repeat(${o.t.w},1fr)`; c.style.gridTemplateRows=`repeat(${o.t.h},1fr)`; for(let i=0;i<o.t.w*o.t.h;i++) c.append(el("i")); e.append(c); }
    e.addEventListener("pointerdown",ev=>startDrag(ev,o.k,plan));
    e.addEventListener("keydown",ev=>{
      const mv={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[ev.key];
      if(mv){ ev.preventDefault(); const it=getItem(o.k), b=itemBox(o.k,it); const nb={...b,x:b.x+mv[0],y:b.y+mv[1]}; if(nb.x>=0&&nb.y>=0&&nb.x+nb.W<=aula.cols&&nb.y+nb.H<=aula.rows&&!overlapsAny(aula,o.k,nb)){ it.x=nb.x; it.y=nb.y; } wz.sel=o.k; render(); const f=document.querySelector(".ed-item.sel"); if(f) f.focus(); }
      if((ev.key==="Delete"||ev.key==="Backspace")&&!o.furn){ aula.taules=aula.taules.filter(t=>t.id!==o.k); wz.sel=null; render(); }
      if(ev.key==="Enter"){ wz.sel=o.k; render(); }
    });
    plan.append(e);
  }
  plan.onpointerdown=ev=>{
    if(ev.target!==plan) return;
    const sz={t1:[1,1],t2:[2,1],t3:[3,1],g4:[2,2],g6:[3,2]}[wz.tool];
    if(!sz){ wz.sel=null; render(); return; }
    const r=plan.getBoundingClientRect(), u=r.width/aula.cols;
    const x=Math.floor((ev.clientX-r.left)/u), y=Math.floor((ev.clientY-r.top)/u);

    if(nb.x<0||nb.y<0||overlapsAny(aula,null,nb)){ toast("Aquí no hi cap. Prova en un espai buit."); return; }
    let n=1; const ids=new Set(aula.taules.map(t=>t.id)); while(ids.has("t"+n)) n++;

function startDrag(ev, key, plan){
  ev.preventDefault(); ev.stopPropagation();

  const it=getItem(key), b=itemBox(key,it), r=plan.getBoundingClientRect(), u=r.width/aula.cols;
  const sx=ev.clientX, sy=ev.clientY, ox=it.x, oy=it.y; let moved=false;

    const nb={...b,x:Math.max(0,Math.min(aula.cols-b.W,ox+dx)),y:Math.max(0,Math.min(aula.rows-b.H,oy+dy))};
    if((nb.x!==it.x||nb.y!==it.y)&&!overlapsAny(aula,key,nb)){ it.x=nb.x; it.y=nb.y; moved=true; Object.assign(target.style,makeRect(aula,false)(it.x,it.y,b.W,b.H)); }
  };
  const up=()=>{ target.removeEventListener("pointermove",mv); target.removeEventListener("pointerup",up); target.removeEventListener("pointercancel",up); if(moved) wz.preset=null; render(); };
  target.addEventListener("pointermove",mv); target.addEventListener("pointerup",up); target.addEventListener("pointercancel",up);
}
